<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ulm Dojo</title>
<meta name="description" content="Review what a Lean theorem actually says: read the definitions behind it, record verdicts bound to their hashes, and see when a change invalidates them.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2c3c22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ulm Dojo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="where">
    <div class="eyebrow" id="room-eyebrow">Review</div>
    <h1 id="room-title">Review</h1>
  </div>
  <button class="icon-btn" id="btn-note" aria-label="Note something about this screen">✎</button>
  <button class="icon-btn" id="btn-about" aria-label="About this prototype">?</button>
</header>

<main>
  <section class="view" id="view-review"></section>
  <section class="view" id="view-read" hidden></section>
  <section class="view" id="view-decide" hidden></section>
  <section class="view" id="view-map" hidden></section>
  <section class="view" id="view-carry" hidden></section>
  <section class="view" id="view-notes" hidden></section>
</main>

<nav class="nav" aria-label="Sections">
  <button data-room="review" aria-current="true"><span class="glyph">✓</span>Review</button>
  <button data-room="read"   aria-current="false"><span class="glyph">❧</span>Read</button>
  <button data-room="decide" aria-current="false"><span class="glyph">◆</span>Decide</button>
  <button data-room="map"    aria-current="false"><span class="glyph">⁙</span>Map</button>
  <button data-room="carry"  aria-current="false"><span class="glyph">▤</span>Carry</button>
  <button data-room="notes"  aria-current="false"><span class="glyph">✎</span>Notes</button>
</nav>

<input type="file" id="shot" accept="image/*" hidden>
<input type="file" id="ledger-file" accept="application/json,.json" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
